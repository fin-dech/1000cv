<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>1000cv</title>

  <style>
    /* ============================================
       ZMIENNE (kolory) - tu zmieniasz wygląd
       ============================================ */
    :root {
      --bg: #010a03;
      --green: #00ff41;
      --dim: #0f6b27;
      --ink: #c2ffd2;
      color-scheme: dark;
    }

    /* ============================================
       PODSTAWY
       ============================================ */
    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      background: transparent;
      color: var(--ink);
      font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
      line-height: 1.6;
    }

    /* Deszcz znaków: płótno na całym ekranie, pod całą treścią */
    #rain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: var(--bg);
    }

    /* ============================================
       NAGŁÓWEK I MENU
       ============================================ */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: calc(env(safe-area-inset-top, 0px) + 0.8rem) 1.2rem 0.8rem;
      background: linear-gradient(var(--bg), transparent);
    }

    header a {
      color: var(--green);
      text-decoration: none;
    }

    header a:hover,
    header a:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    nav {
      display: flex;
      gap: 1.2rem;
    }

    /* ============================================
       EKRAN STARTOWY (hero)
       ============================================ */
    .hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 6rem 1.2rem 3rem;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.6rem, 11vw, 7rem);
      letter-spacing: 0.04em;
      color: var(--green);
      text-shadow: 0 0 18px rgba(0, 255, 65, 0.55);
    }

    .hero p {
      margin: 1rem 0 0;
      color: var(--ink);
    }

    /* Napis "przewijaj" z migającym kursorem */
    .hint {
      margin-top: 3rem;
      color: var(--dim);
    }

    .hint::after {
      content: "_";
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* ============================================
       SEKCJE Z TEKSTEM ODSŁANIANYM PRZY SCROLLU
       .stage = wysoka sekcja (daje miejsce na przewijanie)
       .pin   = ekran przyklejony na środku, gdy przewijasz
       ============================================ */
    .stage {
      height: 320vh;
      position: relative;
    }

    .pin {
      position: sticky;
      top: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.2rem;
    }

    .reveal {
      margin: 0;
      text-align: center;
      font-weight: 700;
      font-size: clamp(2rem, 9vw, 6rem);
      letter-spacing: 0.06em;
      color: var(--green);
      text-shadow: 0 0 16px rgba(0, 255, 65, 0.5);
      overflow-wrap: anywhere;
    }

    /* Każda litera jest osobnym <span>: domyślnie ukryta, klasa "on" ją pokazuje */
    .reveal span {
      opacity: 0;
      transition: opacity 0.12s;
    }

    .reveal span.on {
      opacity: 1;
    }

    .caption {
      text-align: center;
      color: var(--ink);
      margin: 1.2rem auto 0;
      max-width: 52ch;
      min-height: 3.2em;
    }

    /* Ramka na wykres lub screenshot */
    .slot {
      width: min(92vw, 760px);
      aspect-ratio: 16 / 9;
      border: 1px solid var(--dim);
      display: grid;
      place-items: center;
      color: var(--dim);
      background: rgba(1, 10, 3, 0.75);
    }

    /* ============================================
       STOPKA
       ============================================ */
    footer {
      padding: 4rem 1.2rem calc(env(safe-area-inset-bottom, 0px) + 3rem);
      text-align: center;
      color: var(--dim);
      background: var(--bg);
    }

    /* ============================================
       DLA OSÓB Z WYŁĄCZONĄ ANIMACJĄ (reduce motion)
       ============================================ */
    @media (prefers-reduced-motion: reduce) {
      .reveal span {
        opacity: 1;
        transition: none;
      }

      .hint::after {
        animation: none;
      }

      .stage {
        height: auto;
      }

      .pin {
        position: static;
        height: auto;
        padding: 4rem 1.2rem;
      }
    }
  </style>
</head>


<body>

  <!-- Tło: deszcz znaków rysowany w JavaScript -->
  <canvas id="rain" aria-hidden="true"></canvas>

  <!-- Menu na górze -->
  <header>
    <a href="/">1000cv.com</a>

    <nav>
      <a href="o-mnie.html">o mnie</a>
      <a href="raporty.html">raporty</a>
    </nav>
  </header>

  <main>

    <!-- Ekran startowy -->
    <section class="hero">
      <div>
        <h1>1000cv</h1>
        <p>Data Analyst / BI Developer / Data Engineer</p>
        <p class="hint">przewijaj</p>
      </div>
    </section>

    <!-- Sekcja 1: tekst z data-text pojawia się literka po literce -->
    <section class="stage" data-text="AH TEN ANDY">
      <div class="pin">
        <div>
          <h2 class="reveal" aria-label="AH TEN ANDY"></h2>

          <p class="caption">
            Tu wstawisz pierwszy sygnał z Matrixa, np. parafrazę posta z LinkedIna.
          </p>
        </div>
      </div>
    </section>

    <!-- Sekcja 2: tekst plus miejsce na wykres -->
    <section class="stage" data-text="CO POKAZUJĄ DANE">
      <div class="pin">
        <div>
          <h2 class="reveal" aria-label="CO POKAZUJĄ DANE"></h2>

          <div class="slot" style="margin-top: 1.5rem;">
            tu wykres lub screenshot raportu
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer>koniec transmisji</footer>


  <script>
    (function () {

      // Czy użytkownik wyłączył animacje w systemie?
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;


      /* ============================================
         DESZCZ ZNAKÓW
         ============================================ */

      var canvas = document.getElementById("rain");
      var ctx = canvas.getContext("2d");

      // Znaki, które spadają
      var chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789".split("");

      var size = 16;   // rozmiar znaku w px (większy = mniej kolumn = lżej dla telefonu)
      var cols;        // liczba kolumn
      var drops;       // pozycja spadającego znaku w każdej kolumnie
      var last = 0;    // czas ostatniej klatki


      // Dopasowanie płótna do okna
      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = innerWidth * dpr;
        canvas.height = innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        cols = Math.ceil(innerWidth / size);

        drops = Array.from({ length: cols }, function () {
          return Math.random() * -50;
        });

        ctx.fillStyle = "#010a03";
        ctx.fillRect(0, 0, innerWidth, innerHeight);
      }


      // Rysowanie jednej klatki
      function draw(t) {

        // Rysuj co ok. 55 ms (nie na każdą klatkę przeglądarki)
        if (t - last > 55) {
          last = t;

          // Półprzezroczyste tło zostawia "ogon" za znakami
          ctx.fillStyle = "rgba(1, 10, 3, 0.12)";
          ctx.fillRect(0, 0, innerWidth, innerHeight);

          ctx.font = size + "px monospace";

          for (var i = 0; i < cols; i++) {
            var y = drops[i] * size;

            // Czasem jasny znak, zwykle zielony
            ctx.fillStyle = Math.random() > 0.96 ? "#d8ffe2" : "#00b82e";

            var randomChar = chars[(Math.random() * chars.length) | 0];
            ctx.fillText(randomChar, i * size, y);

            // Po dojściu do dołu kolumna losowo zaczyna od góry
            if (y > innerHeight && Math.random() > 0.975) {
              drops[i] = 0;
            }

            drops[i]++;
          }
        }

        requestAnimationFrame(draw);
      }


      resize();
      addEventListener("resize", resize);

      // Animuj tylko, jeśli użytkownik nie wyłączył ruchu
      if (!reduce) {
        requestAnimationFrame(draw);
      }


      /* ============================================
         TEKST ODSŁANIANY PRZY PRZEWIJANIU
         ============================================ */

      // Dla każdej sekcji .stage: rozbij tekst z data-text na pojedyncze litery
      var stages = Array.prototype.map.call(
        document.querySelectorAll(".stage"),
        function (el) {
          var text = el.dataset.text;
          var heading = el.querySelector(".reveal");

          var spans = text.split("").map(function (ch) {
            var s = document.createElement("span");

            // Zwykła spacja zwinęłaby się, więc używamy twardej
            s.textContent = (ch === " ") ? "\u00a0" : ch;

            heading.appendChild(s);
            return s;
          });

          return { el: el, spans: spans };
        }
      );


      // Przy każdym przewinięciu policz, ile liter pokazać
      function update() {
        if (reduce) {
          return;
        }

        var vh = innerHeight;

        stages.forEach(function (st) {
          var r = st.el.getBoundingClientRect();

          // Postęp przewijania sekcji: od 0 (początek) do 1 (koniec)
          var p = Math.min(Math.max(-r.top / (r.height - vh), 0), 1);

          // Ile liter ma być widocznych.
          // Mnożnik 1.5 sprawia, że cały napis jest gotowy przed końcem sekcji.
          var n = Math.round(p * 1.5 * st.spans.length);

          st.spans.forEach(function (s, i) {
            s.classList.toggle("on", i < n);
          });
        });
      }


      addEventListener("scroll", update, { passive: true });
      addEventListener("resize", update);
      update();

    })();
  </script>

</body>
</html>
